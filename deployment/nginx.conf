server {
    listen 443 ssl;
    server_name mypi.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    root /srv/mypi/dist/web;
    index index.html;
    # The ZIP import route accepts 10 MiB archives encoded as base64. Gateway
    # retains its 32 KiB default body limit for ordinary routes.
    client_max_body_size 15m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location /health/ { proxy_pass http://127.0.0.1:4100; }
    location / { try_files $uri $uri/ /index.html; }
}
server { listen 80; server_name mypi.example.com; return 308 https://$host$request_uri; }
