<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">MyPI 项目海报</title>
  <desc id="description">MyPI 编码 Agent。把想法写成可运行的代码，提供共享 Agent Core、按需工具与可追溯执行。</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#DCEAE4" stroke-width="1"/>
    </pattern>
    <clipPath id="window-clip"><rect x="802" y="180" width="704" height="544" rx="22"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#244D41" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#F6F8FA"/>
  <path d="M1090 0h510v900H780z" fill="#E9F5EF"/>
  <path d="M1260 0h340v900H920z" fill="url(#grid)" opacity=".65"/>
  <circle cx="1500" cy="110" r="230" fill="#D5EDE1" opacity=".58"/>
  <circle cx="913" cy="815" r="136" fill="#D5EDE1" opacity=".64"/>

  <g transform="translate(94 75)">
    <rect width="58" height="58" rx="14" fill="#137D64"/>
    <path d="M14.5 20.5h29M21.5 21v19M36.5 21v14c0 4 2 5.5 7 5.5" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="42" fill="#1D2939" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="700" letter-spacing="-1.5">MyPI</text>
  </g>
  <text x="95" y="185" fill="#137D64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">CODING AGENT</text>
  <text x="90" y="318" fill="#1D2939" font-family="PingFang SC,Microsoft YaHei,Segoe UI,sans-serif" font-size="66" font-weight="700" letter-spacing="-2">把想法，写成</text>
  <text x="90" y="408" fill="#137D64" font-family="PingFang SC,Microsoft YaHei,Segoe UI,sans-serif" font-size="66" font-weight="700" letter-spacing="-2">可运行的代码。</text>
  <text x="95" y="485" fill="#526173" font-family="PingFang SC,Microsoft YaHei,Segoe UI,sans-serif" font-size="23">从理解项目，到修改、验证与交付。</text>
  <text x="95" y="521" fill="#526173" font-family="PingFang SC,Microsoft YaHei,Segoe UI,sans-serif" font-size="23">让每一步都有清晰的上下文与执行轨迹。</text>

  <g font-family="PingFang SC,Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="600">
    <rect x="94" y="586" width="184" height="49" rx="12" fill="#fff" stroke="#D6E5DE"/>
    <circle cx="120" cy="610" r="7" fill="#137D64"/>
    <text x="140" y="616" fill="#1D2939">共享 Agent Core</text>
    <rect x="290" y="586" width="142" height="49" rx="12" fill="#fff" stroke="#D6E5DE"/>
    <circle cx="316" cy="610" r="7" fill="#137D64"/>
    <text x="336" y="616" fill="#1D2939">按需工具</text>
    <rect x="444" y="586" width="159" height="49" rx="12" fill="#fff" stroke="#D6E5DE"/>
    <circle cx="470" cy="610" r="7" fill="#137D64"/>
    <text x="490" y="616" fill="#1D2939">执行可追溯</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="802" y="180" width="704" height="544" rx="22" fill="#fff" stroke="#D5E3DC" stroke-width="2"/>
  </g>
  <g clip-path="url(#window-clip)" font-family="PingFang SC,Microsoft YaHei,Segoe UI,sans-serif">
    <rect x="802" y="180" width="704" height="54" fill="#fff"/>
    <path d="M802 234h704" stroke="#E2E7EC"/>
    <circle cx="829" cy="207" r="5" fill="#C7D4CE"/>
    <circle cx="847" cy="207" r="5" fill="#C7D4CE"/>
    <circle cx="865" cy="207" r="5" fill="#C7D4CE"/>
    <text x="1139" y="212" fill="#687587" font-size="13" text-anchor="middle">MyPI / 对话工作台</text>

    <rect x="802" y="234" width="146" height="490" fill="#F0F3F5"/>
    <path d="M948 234v490" stroke="#E2E7EC"/>
    <rect x="822" y="255" width="30" height="30" rx="8" fill="#137D64"/>
    <path d="M829 266h16m-12 0v11m8-11v9c0 2 1 3 4 3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="861" y="277" fill="#1D2939" font-size="17" font-weight="700">MyPI</text>
    <rect x="817" y="314" width="116" height="36" rx="8" fill="#E3F1EB"/>
    <text x="833" y="338" fill="#0E6752" font-size="14" font-weight="600">对话工作台</text>
    <text x="833" y="381" fill="#687587" font-size="14">项目文件</text>
    <path d="M818 401h114" stroke="#DFE5E8"/>
    <text x="833" y="433" fill="#687587" font-size="12">最近的会话</text>
    <rect x="821" y="454" width="103" height="9" rx="4.5" fill="#DAE2E6"/>
    <rect x="821" y="475" width="77" height="9" rx="4.5" fill="#DAE2E6"/>

    <rect x="948" y="234" width="558" height="50" fill="#fff"/>
    <text x="973" y="264" fill="#1D2939" font-size="16" font-weight="650">对话工作台</text>
    <rect x="1387" y="249" width="93" height="23" rx="7" fill="#E9F5EF"/>
    <circle cx="1400" cy="260" r="4" fill="#137D64"/>
    <text x="1411" y="265" fill="#0E6752" font-size="12">按需加载</text>
    <path d="M948 284h558" stroke="#E2E7EC"/>

    <rect x="971" y="311" width="338" height="64" rx="12" fill="#F2F6F8"/>
    <text x="991" y="337" fill="#687587" font-size="12">任务</text>
    <text x="991" y="359" fill="#1D2939" font-size="15" font-weight="600">帮我理解这段代码的作用</text>
    <rect x="971" y="393" width="394" height="142" rx="12" fill="#fff" stroke="#DDE6E9"/>
    <rect x="989" y="411" width="25" height="25" rx="7" fill="#E9F5EF"/>
    <path d="m1000 419-5 4 5 4m7-8 5 4-5 4" fill="none" stroke="#137D64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1026" y="429" fill="#1D2939" font-size="14" font-weight="700">MyPI</text>
    <text x="989" y="465" fill="#334155" font-size="14">先阅读相关文件，梳理入口与调用关系。</text>
    <text x="989" y="491" fill="#334155" font-size="14">再给出可验证的修改建议。</text>
    <rect x="989" y="507" width="65" height="17" rx="5" fill="#E9F5EF"/>
    <text x="1021" y="519" fill="#0E6752" font-size="10" text-anchor="middle">read</text>

    <rect x="971" y="633" width="509" height="67" rx="12" fill="#fff" stroke="#D9E2E8"/>
    <text x="991" y="672" fill="#8390A1" font-size="14">描述你的任务，或明确请求使用扩展工具…</text>
    <rect x="1435" y="649" width="30" height="30" rx="8" fill="#137D64"/>
    <path d="m1450 671 0-12m-5 5 5-5 5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M94 753h516" stroke="#CBD9D2"/>
  <text x="95" y="793" fill="#526173" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1.5">CLI  /  WEB  /  ADMIN</text>
  <text x="1499" y="786" fill="#526173" font-family="PingFang SC,Microsoft YaHei,Segoe UI,sans-serif" font-size="15" text-anchor="end">工作台界面示意</text>
  <text x="95" y="846" fill="#7C8795" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">MYPI · BUILD WITH CLARITY</text>
</svg>
