ields-row"><div class="field"><label for="rule-mode">工具模式</label><select id="rule-mode"><option value="explicit">按需加载</option><option value="native">原生模式</option></select></div><div class="field"><label for="rule-source">消息来源（测试变量）</label><select id="rule-source"><option value="human">真实用户输入</option><option value="tool">工具返回</option><option value="subtask">子任务结果</option></select></div></div>${btn(`${icon('play')} 测试匹配`,'test-rule','btn primary')}<div class="rule-result" id="rule-result" role="status">点击测试，查看命中依据与拒绝原因。</div></section></div>`;}
  function executionsPage(){const runs=state.conversations.flatMap(c=>c.runs.map(r=>({...r,conversation:c.title}))).reverse();return `${heading('运行与子任务','主请求、子任务、后台进程分开观察；按来源 Run 关联结果。',btn(`${icon('download')} 导出记录`,'export','btn'))}${demoBanner()}<div class="stats">${stat('本页请求',runs.length,'包含完成和取消的主请求','chat')}${stat('子任务',allTasks().length,'仅本次页面真实模拟产生','branch')}${stat('正在运行',allTasks().filter(t=>running(t.status)).length,'浏览器定时器驱动','clock')}${stat('工具结果通知','事件驱动','无 Agent 轮询循环','spark')}</div><section class="table-wrap"><table><thead><tr><th>请求 ID / 会话</th><th>模式</th><th>能力组</th><th>状态</th><th>操作</th></tr></thead><tbody>${runs.length?runs.map(r=>`<tr><td><strong class="mono">${r.id}</strong><small>${esc(r.conversation)}</small></td><td>${r.mode==='native'?'原生':'按需'}</td><td>${r.groups.map(g=>R.GROUPS[g].label).join('、')||'无扩展'}</td><td>${statusTag(r.status)}</td><td>${btn('查看详情','run-detail','btn small',`data-id="${r.id}"`)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">尚未产生本地请求。返回对话页发送任务后在此查看。</td></tr>'}</tbody></table></section><h3 style="margin:24px 0 14px">子任务 / 后台进程</h3><div class="policy-grid">${allTasks().map(taskCard).join('')||'<div class="card muted tiny">暂无执行记录。</div>'}</div>`;}
  function auditTable(rows){return `<div class="table-wrap"><table><thead><tr><th>时间</th><th>动作</th><th>对象</th><th>说明</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.time)}</td><td><span class="audit-action">${esc(r.action)}</span></td><td>${esc(r.target)}</td><td style="white-space:normal;min-width:170px">${esc(r.detail)}</td></tr>`).join('')}</tbody></table></div>`;}

  function previewIntent(){

  const addMessage=(c,role,text,extra={})=>c.messages.push({id:uid('msg'),role,text,time:clock(),...extra});
  function send(){
    const c=conv();if(c.mainRun){cancelRun(c,'用户停止了主请求');return;}
    const text=c.draft.trim();if(!text)return;
    if(state.policy.paused){toast('公开体验已暂停，请在后台演示中恢复。');return;}
    if(state.guest.banned){toast('当前演示身份已封禁，请在游客管理中解除。');return;}
    if(state.guest.used>=state.policy.daily){toast('本页游客请求额度已用尽。');return;}
    if(!state.models.some(m=>m.id===state.model&&m.enabled)){toast('没有可用模型，请在后台启用模型。');return;}
    const result=R.matchIntent(text,c.mode,'human');
    if(result.reasonCode==='INPUT_LIMIT'){toast('文本超过 16 KiB，请缩短后重试。');return;}
    const groups=result.groups.filter(g=>state.policy.allowed.includes(g));
    const r={id:uid('run'),mode:c.mode,groups,resources:{},model:state.model,status:'running',createdAt:clock(),prompt:text,evidence:result.evidence,denyReasons:result.reasons};
    c.mainRun=r;c.runs.push(r);state.guest.used++;state.visitors[0].used=state.guest.used;
    if(!c.messages.length)c.title=text.length>16?text.slice(0,16)+'…':text;
    addMessage(c,'user',text);c.draft='';$('#prompt').value='';event(c,`请求接受 · ${groups.length?groups.map(g=>R.GROUPS[g].label).join('、'):'保持四个原生工具'}`,'grant',r.id);
    log('run.accepted',r.id,`${c.mode} / ${groups.join(',')||'native only'} / 本地模拟`);refresh();
    setTimeout(()=>{
      if(r.status!=='running')return;
      if(groups.includes('delegate'))startTasks(c,r,'delegate');
      if(groups.includes('workflow'))startTasks(c,r,'workflow');
      if(groups.includes('background')){r.resources.background=true;startTasks(c,r,'background');}
      if(groups.includes('session')){r.resources.session=true;c.workItems.push(...['检查输入校验边界','补充测试覆盖','整理修改与风险'].map(text=>({id:uid('item'),text,done:false})));event(c,'已创建 3 个会话工作项（模拟）','task',r.id);}
      event(c,'模拟工具调用完成 · 工具输出视为不可信数据','tool',r.id);refresh();
    },450);
    setTimeout(()=>{
      if(r.status!=='running')return;
      let text='已演示一次基础编码请求。真实系统将在隔离工作区读取文件、生成修改并验证测试；本页只展示静态结果，不执行代码。';
      let report={title:'代码修改预览',body:'示例补充输入格式校验，并附带测试建议。尚未运行测试，也没有修改服务器文件。',file:'changes.patch'};
      if(groups.includes('search')){text='已模拟搜索鉴权相关实现，定位到输入校验与测试文件。检索输出作为证据，不会被解释成新的工具授权。';report={title:'找到 2 个相关文件（示例）',body:'src/auth.ts：输入校验；tests/auth.test.ts：有效和无效输入场景。',file:'src/auth.ts',icon:'search'};}
      if(groups.includes('delegate')||groups.includes('workflow')){text='已启动独立任务，本次主请求先结束。你现在可以继续发送其他任务；子任务完成后会以事件回传，并标注来源请求。';report={title:groups.includes('workflow')?'工作流节点已启动':'两个子代理正在并行处理',body:'各任务使用独立的上下文和冻结授权快照；主请求结束不会中断已授权的子任务。',icon:'branch'};}
      if(groups.includes('background')){text+='\n后台进程持独立租约继续运行，可在并行任务面板取消。';report={title:'后台服务启动演示',body:'仅用浏览器计时模拟状态；没有执行 shell，没有开放真实端口。',icon:'terminal'};}
      if(groups.includes('session')){text+='\n已记录本次会话工作项，可在并行任务面板切换完成状态。';}
      if(!groups.length&&c.mode==='native'&&R.matchIntent(r.prompt,'explicit').groups.length)text='当前为原生模式，本次只暴露 read / write / edit / bash。MyPI 扩展未加载；切换到按需加载模式后重新明确请求，才能演示扩展能力。';
      if(result.groups.length&&!groups.length){text='该能力被管理员策略禁用，本次未激活 MyPI 扩展工具。原生能力的执行也需要独立通过后端安全检查。';report={title:'策略拒绝',body:'匹配意图不等于授权成功。',icon:'shield'};}
      addMessage(c,'assistant',text,{tools:R.activeTools(groups,r.resources),report,origin:r.id});
      r.status='completed';r.finishedAt=clock();c.mainRun=null;event(c,'主请求完成 · 释放授权，MyPI 扩展工具归零','settled',r.id);refresh();drainSummaries(c);
    },1550);
  }
  function startTasks(c,r,type){
    const names=type==='background'?['开发服务 · 有界日志']:type==='workflow'?['节点 1 · 代码审查','节点 2 · 测试建议']:['子代理 A · 鉴权逻辑审查','子代理 B · 测试覆盖检查'];
    const batch=uid('batch');
    names.forEach((name,i)=>{
      const t={id:uid('task'),name,type,batch,originRunId:r.id,status:'running',grants:4,result:'',createdAt:clock()};c.tasks.push(t);
      event(c,`${name} 启动`,'task',r.id);
      setTimeout(()=>{
        if(t.status!=='running')return;
        t.status='completed';t.finishedAt=clock();t.result=type==='background'?'模拟服务正常结束；最后日志：ready → stopped。':i===0?'发现 1 项输入边界建议：处理空对象与非字符串参数（静态样例）。':'建议补充空值、异常类型和边界长度的测试（静态样例）。';
        event(c,`${t.name} 完成 · 结果进入 Inbox（模拟）`,'result',r.id);collectSummary(c,t);refresh();
      },type==='background'?6600:3100+i*1700);
    });
  }
  function collectSummary(c,t){
    const batchTasks=c.tasks.filter(x=>x.batch===t.batch);
    if(batchTasks.some(x=>running(x.status)))return;
    if(c.summaries.some(x=>x.batch===t.batch))return;
    c.summaries.push({batch:t.batch,origin:t.originRunId,delivered:false,tasks:batchTasks});drainSummaries(c);
  }
  function drainSummaries(c){
    if(c.mainRun)return;
    for(const s of c.summaries.filter(x=>!x.delivered)){
      s.delivered=true;
      const completed=s.tasks.filter(t=>t.status==='completed');
      addMessage(c,'assistant',`来源 ${s.origin} 的独立任务已结束：${completed.length} 个完成，${s.tasks.length-completed.length} 个取消。\n${completed.map(t=>t.result).join('\n')||'没有可汇总的结果。'}`,{origin:s.origin,report:{title:'事件结果汇总 · tools = []',body:'本条结果只归属于来源请求，不重新开通扩展工具，也不将子任务文本当作用户授权。',icon:'branch'}});
      event(c,'结果汇总已呈现 · 内部消息不产生工具授权','summary',s.origin);
    }
    refresh();
  }
  function cancelTask(id,reason='用户取消任务'){
    const c=state.conversations.find(x=>x.tasks.some(t=>t.id===id));if(!c)return;
    const t=c.tasks.find(t=>t.id===id);if(!running(t.status))return;
    t.status='cancelled';t.result=reason;t.finishedAt=clock();event(c,`${t.name} 已取消`,'cancel',t.originRunId);collectSummary(c,t);log('task.cancelled',id,reason);refresh();
  }
  function cancelRun(c,reason){
    const r=c.mainRun;if(!r)return;
    r.status='cancelled';r.finishedAt=clock();c.mainRun=null;
    c.tasks.filter(t=>t.originRunId===r.id&&running(t.status)).forEach(t=>cancelTask(t.id,reason));
    addMessage(c,'assistant',`${reason}。本次授权已释放，工具列表恢复到四个原生工具。`,{origin:r.id});event(c,'请求取消 · 授权已释放','cancel',r.id);log('run.cancelled',r.id,reason);refresh();
  }
  function openModal(title,body,footer='',wide=false){const d=$('#modal');d.className=wide?'wide':'';d.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2>${btn(icon('close'),'close-modal','icon-btn','aria-label="关闭弹窗"')}</div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}`;if(!d.open)d.showModal();}

  function testRule(){const result=R.matchIntent($('#rule-input').value,$('#rule-mode').value,$('#rule-source').value);const admitted=result.groups.filter(g=>state.policy.allowed.includes(g));$('#rule-result').innerHTML=`<strong>${admitted.length?'命中 '+admitted.map(g=>R.GROUPS[g].label).join('、'):'不激活扩展工具'}</strong><br>匹配组：${result.groups.join(', ')||'无'} · 策略通过：${admitted.join(', ')||'无'}<br><span class="muted">${esc(result.reasons.join('；'))}</span><br>${result.evidence.map(e=>`<span class="rule-evidence">${esc(e.text)}</span>`).join('')}<div class="tiny muted" style="font-size:10px">${result.reasonCode} · 原型规则，不是安全证明</div>`;}
  async function handleAction(action,b){
    const id=b.dataset.id;
    if(action.startsWith('nav-')){state.view=action.slice(4);state.mobile=false;render();return;}
    switch(action){
      case 'chat':state.view='chat';state.mobile=false;render();break;
      case 'new-chat':{const c=makeConversation();state.conversations.unshift(c);state.current=c.id;state.view='chat';state.tab='trace';state.mobile=false;render();$('#prompt').focus();break;}
      case 'select-chat':state.current=id;state.mobile=false;render();break;
      case 'mobile':state.mobile=!state.mobile;render();break;
      case 'inspect':state.inspect=!state.inspect;render();break;
      case 'files':state.view='chat';state.tab='files';state.inspect=true;state.mobile=false;render();break;
      case 'tab':state.tab=b.dataset.tab;render();break;
      case 'example':{const key=b.dataset.key;conv().draft=prompts[key]||prompts.ordinary;$('#prompt').value=conv().draft;$('#prompt').focus();previewIntent();break;}
      case 'mode-native':case 'mode-explicit':{conv().mode=action.slice(5);render();toast(conv().mainRun?'模式将在下一次请求生效；当前授权快照不变。':conv().mode==='native'?'原生模式：固定四个基础工具。':'按需模式：只对明确执行请求开通能力。');break;}
      case 'admin-gate':openModal('进入后台交互演示',`<p>这是公开可体验的 <strong>Mock 管理视图</strong>，没有管理员权限，也不能操作任何真实用户或密钥。</p><div class="security-note">${icon('shield')}<span>真实部署时，/admin 必须使用独立认证与服务端鉴权，不能依赖隐藏按钮或前端路由。</span></div>`,btn('取消','close-modal','btn')+btn('进入 Mock 后台','enter-admin','btn primary'));break;
      case 'enter-admin':closeModal();state.view='overview';state.mobile=false;render();break;
      case 'close-modal':closeModal();break;
      case 'about':openModal('MyPI · 交互原型',`<p>一份可离线运行的产品交互样例。支持对话、两种工具模式、五个能力组、并行任务回传、示例文件和后台配置流程。</p><div class="divider"></div><p><strong>不会：</strong>调用大模型、连接 Pi SDK、访问网络、执行 shell 或认证管理员。所有响应和执行记录都是模拟数据。刷新页面恢复初始状态。</p><div class="divider"></div><p>实际实现要求详见交付包 README、docs/07-security.md 与 IMPLEMENTATION_PROMPT.md。</p>`,btn('继续体验','close-modal','btn primary'));break;
      case 'file':fileModal(b.dataset.file);break;
      case 'download-file':download(b.dataset.file.split('/').pop(),files[b.dataset.file]);toast('已导出静态示例文件。');break;
      case 'copy-file':try{await navigator.clipboard.writeText(files[b.dataset.file]);toast('示例内容已复制。');}catch{toast('当前环境不允许剪贴板访问，请选择代码手动复制。');}break;
      case 'cancel-task':cancelTask(id);toast('任务已取消（本地模拟）。');break;
      case 'toggle-item':{const w=conv().workItems.find(x=>x.id===id);if(w){w.done=!w.done;refresh();}break;}
      case 'add-model':modelModal();break;
      case 'edit-model':modelModal(id);break;
      case 'toggle-model':{const m=state.models.find(x=>x.id===id);if(!m)break;m.enabled=!m.enabled;if(!state.models.some(x=>x.enabled&&x.id===state.model))state.model=state.models.find(x=>x.enabled)?.id||'';log('model.toggled',m.name,m.enabled?'启用演示模型':'停用演示模型');render();toast('模型状态已在本页更新。');break;}
      case 'test-model':{const m=state.models.find(x=>x.id===id);if(!m)break;m.test='测试中 · Mock';render();setTimeout(()=>{m.test='模拟通过';log('model.tested',m.name,'未发送真实网络请求');if(state.view==='models')render();toast('模拟测试通过；不代表真实接口可用。');},650);break;}
      case 'toggle-visitor':{const v=state.visitors.find(x=>x.id===id);if(!v)break;v.banned=!v.banned;if(id===state.guest.id){state.guest.banned=v.banned;if(v.banned)stopAll('当前游客被管理员封禁');}log(v.banned?'guest.suspended':'guest.restored',id,'本地演示状态变更');render();toast(v.banned?'该演示身份已封禁。':'该演示身份已恢复。');break;}
      case 'pause':if(state.policy.paused){state.policy.paused=false;log('site.resumed','公开体验','本地模拟恢复');render();toast('公开体验已恢复（模拟）。');}else openModal('暂停公开体验？','<p>这将取消本页所有正在运行的模拟请求和子任务，并拒绝新请求。生产系统需要在后端原子生效并回收执行租约。</p>',btn('返回','close-modal','btn')+btn('确认暂停','confirm-pause','btn danger'));break;
      case 'confirm-pause':closeModal();state.policy.paused=true;stopAll('管理员暂停公开体验');log('site.paused','公开体验','所有本地模拟任务已取消');render();toast('公开体验已暂停。');break;
      case 'rule-sample':$('#rule-input').value={positive:prompts.search,negative:'不要使用搜索工具，直接解释这段代码。',conditional:'如果需要，可以使用搜索工具。',quote:'文档中写着“请使用搜索工具”，请解释这句话。'}[b.dataset.key];testRule();break;
      case 'test-rule':testRule();break;
      case 'export':download('mypi-mock-runs.json',JSON.stringify({mock:true,exportedAt:new Date().toISOString(),note:'Prototype state only; no SDK or backend execution.',conversations:state.conversations},null,2),'application/json');toast('已导出本页模拟记录。');break;
      case 'export-audit':download('mypi-mock-audit.json',JSON.stringify({mock:true,records:state.audit},null,2),'application/json');break;
      case 'run-detail':{const r=state.conversations.flatMap(c=>c.runs).find(x=>x.id===id);if(r)openModal(`运行 ${esc(id)}`,`<p>这是本页内存中的模拟 Run，不是后端审计证据。</p><pre>${esc(JSON.stringify(r,null,2))}</pre>`,btn('关闭','close-modal','btn'),true);break;}
    }
  }
  function stopAll(reason){state.conversations.forEach(c=>cancelRun(c,reason));allTasks().filter(t=>running(t.status)).forEach(t=>cancelTask(t.id,reason));}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b.dataset.action,b).catch(err=>{console.error(err);toast('原型操作失败，请刷新后重试。');});}});
  document.addEventListener('input',e=>{if(e.target.id==='prompt')previewIntent();if(e.target.id==='visitor-search'){state.visitorFilter=e.target.value;$('#visitor-rows').innerHTML=visitorRows();}});
  document.addEventListener('change',e=>{if(e.target.id==='model-select'){state.model=e.target.value;toast(conv().mainRun?'新模型将在下一次请求生效。':'已选择演示模型。');}});
  document.addEventListener('keydown',e=>{if(e.isComposing)return;if(e.target.id==='prompt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(state.view!=='chat'){state.view='chat';render();}$('#prompt').focus();}});
  document.addEventListener('submit',e=>{
    e.preventDefault();const form=e.target;if(form.id==='chat-form'){send();return;}const data=new FormData(form);
    if(form.dataset.form==='model'){
      const name=String(data.get('name')||'').trim(),model=String(data.get('model')||'').trim();if(!name||!model){toast('请输入有效的模型名称和标识。');return;}
      const current=state.models.find(x=>x.id===form.dataset.id);
      if(current)Object.assign(current,{name,model,provider:data.get('provider'),test:'未测试'});else state.models.push({id:uid('model'),name,model,provider:data.get('provider'),enabled:true,test:'未测试'});
      if(!state.model)state.model=state.models.find(x=>x.enabled)?.id||'';log('model.saved',name,'只保存本地非敏感显示字段');closeModal();render();toast('演示模型已保存。');
    }
    if(form.dataset.form==='policy'){
      const old=[...state.policy.allowed];for(const key of ['daily','tokens','parallel','calls'])state.policy[key]=Number(data.get(key));state.policy.allowed=data.getAll('allowed');
      const removed=old.filter(g=>!state.policy.allowed.includes(g));
      for(const c of state.conversations){if(c.mainRun?.groups.some(g=>removed.includes(g)))cancelRun(c,'能力已被管理员撤销');c.tasks.filter(t=>running(t.status)&&removed.includes(t.type)).forEach(t=>cancelTask(t.id,'能力已被管理员撤销'));}
      log('policy.updated','公开体验策略',`每日 ${state.policy.daily} 次；能力 ${state.policy.allowed.join(',')||'无'}`);render();toast('策略已保存；本原型不模拟真实 Token 计费。');
    }
  });
  window.MyPIPrototype={snapshot:()=>JSON.parse(JSON.stringify(state)),version:'1.0.0-mock'};
  render();
})();
</script></body></html>
